<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Habitaciones | Atlan Suites</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script><script>tailwind.config = { prefix: "tw-", corePlugins: { preflight: false } };</script>
    <link rel="stylesheet" th:href="@{/css/habitaciones/lista.css}" href="/css/habitaciones/lista.css" />
  </head>
  <body class="portal-body">
    <div th:replace="~{fragments/admin-shell :: header('habitaciones')}"></div>
    <main class="portal-main"><div class="container-xxl">
      <header class="page-heading"><div><p class="page-eyebrow">Inventario del hotel</p><h1 class="page-title">Habitaciones</h1><p class="page-description">Controla el tipo, la ubicación y el estado operativo de cada habitación.</p></div><a class="atlan-btn atlan-btn--primary" th:href="@{/admin/habitaciones/create}">Nueva habitación <span aria-hidden="true">＋</span></a></header>
      <section class="surface-card" aria-labelledby="room-list-title">
        <h2 class="visually-hidden" id="room-list-title">Listado de habitaciones</h2>
        <div class="table-shell"><table class="table portal-table">
          <thead><tr><th>Número</th><th>Piso</th><th>Estado</th><th>Disponibilidad</th><th>Tipo</th><th>Acciones</th></tr></thead>
          <tbody>
            <tr th:each="habitacion : ${habitaciones}"><td><span class="room-number" th:text="${habitacion.numero}">101</span></td><td class="muted-cell" th:text="${habitacion.piso}">1</td><td><span class="status-badge" th:classappend="${habitacion.estado.name() == 'DISPONIBLE' ? ' status-badge--success' : ' status-badge--occupied'}" th:text="${habitacion.estado.name() == 'DISPONIBLE' ? 'Disponible' : 'Ocupada'}">Disponible</span></td><td><span class="status-badge" th:classappend="${habitacion.disponible} ? ' status-badge--success' : ' status-badge--unavailable'" th:text="${habitacion.disponible ? 'Disponible' : 'Ocupada'}">Disponible</span></td><td class="muted-cell" th:text="${habitacion.idTipo}">1</td><td><div class="table-actions tw-flex tw-gap-2"><a class="atlan-btn atlan-btn--secondary atlan-btn--small" th:href="@{/admin/habitaciones/read/{numero}(numero=${habitacion.numero})}">Ver</a><a class="atlan-btn atlan-btn--edit atlan-btn--small" th:href="@{/admin/habitaciones/update/{numero}(numero=${habitacion.numero})}">Editar</a><form th:action="@{/admin/habitaciones/delete/{numero}(numero=${habitacion.numero})}" method="post" onsubmit="return confirm('¿Deseas eliminar esta habitación?');"><button class="atlan-btn atlan-btn--danger atlan-btn--small" type="submit">Eliminar</button></form></div></td></tr>
            <tr th:if="${#lists.isEmpty(habitaciones)}"><td class="empty-state" colspan="6">No hay habitaciones registradas. Agrega la primera para comenzar.</td></tr>
          </tbody>
        </table></div>
      </section>
    </div></main>
    <div th:replace="~{fragments/admin-shell :: footer}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
