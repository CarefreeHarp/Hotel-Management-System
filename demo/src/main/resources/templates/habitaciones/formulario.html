<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${titulo + ' | Atlan Suites'}">Formulario de habitación | Atlan Suites</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script><script>tailwind.config = { prefix: "tw-", corePlugins: { preflight: false } };</script>
    <link rel="stylesheet" th:href="@{/css/habitaciones/formulario.css}" href="/css/habitaciones/formulario.css" />
  </head>
  <body class="portal-body">
    <div th:replace="~{fragments/admin-shell :: header('habitaciones')}"></div>
    <main class="portal-main"><div class="container-xxl">
      <header class="page-heading"><div><p class="page-eyebrow">Inventario del hotel</p><h1 class="page-title" th:text="${titulo}">Habitación</h1><p class="page-description">Define la ubicación, categoría, estado e imágenes de la habitación.</p></div></header>
      <form class="surface-card form-card" th:action="${accion}" th:object="${habitacion}" method="post">
        <div class="portal-alert" th:if="${error}" role="alert" th:text="${error}"></div>
        <section class="form-section" aria-labelledby="room-basic-title"><h2 class="form-section__title" id="room-basic-title">Información de la habitación</h2><p class="form-section__description">Datos que permiten ubicarla y relacionarla con el catálogo.</p>
          <div class="row g-3"><div class="col-md-6"><label class="portal-label form-label" for="numero">Número</label><input class="portal-control form-control" id="numero" type="number" min="1" th:field="*{numero}" placeholder="Ej. 301" required /></div><div class="col-md-6"><label class="portal-label form-label" for="piso">Piso</label><input class="portal-control form-control" id="piso" type="number" min="0" th:field="*{piso}" placeholder="Ej. 3" required /></div><div class="col-md-6"><label class="portal-label form-label" for="idTipo">Tipo de habitación</label><select class="portal-select form-select" id="idTipo" th:field="*{idTipo}" required><option value="0">Seleccione un tipo</option><option th:each="tipo : ${tipos}" th:value="${tipo.idTipo}" th:text="${tipo.nombre}">Suite</option></select></div><div class="col-md-6"><label class="portal-label form-label" for="estado">Estado operativo</label><select class="portal-select form-select" id="estado" th:field="*{estado}" required><option value="">Seleccione un estado</option><option th:each="estado : ${estados}" th:if="${estado.name() != 'MANTENIMIENTO'}" th:value="${estado}" th:text="${estado.name() == 'DISPONIBLE' ? 'Disponible' : 'Ocupada'}">Disponible</option></select></div><div class="col-12"><div class="availability-box"><label class="portal-label" for="disponible">Disponible para reservar</label><div class="form-check form-switch mb-0"><input class="form-check-input" id="disponible" type="checkbox" role="switch" th:field="*{disponible}" /></div></div></div></div>
        </section>
        <section class="form-section" aria-labelledby="room-photos-title"><h2 class="form-section__title" id="room-photos-title">Galería</h2><p class="form-section__description">Agrega enlaces públicos a fotografías horizontales de buena calidad.</p>
          <div class="mb-3"><label class="portal-label form-label" for="fotoPrincipal">URL de foto principal</label><input class="portal-control form-control" id="fotoPrincipal" type="url" th:field="*{fotoPrincipal}" placeholder="https://ejemplo.com/habitacion.jpg" /></div>
          <div class="photo-fields" id="fotos-adicionales"><div class="photo-field" th:each="foto, estadoFoto : *{fotos}"><span class="photo-field__number" th:text="${estadoFoto.index + 1}">1</span><div><label class="visually-hidden" th:for="'foto-' + ${estadoFoto.index}">URL de foto adicional</label><input class="portal-control form-control" type="url" th:id="'foto-' + ${estadoFoto.index}" th:field="*{fotos[__${estadoFoto.index}__]}" placeholder="https://ejemplo.com/habitacion-adicional.jpg" /></div></div></div>
          <button class="atlan-btn atlan-btn--secondary atlan-btn--small mt-3" id="agregar-foto" type="button">＋ Añadir otra foto</button>
        </section>
        <div class="form-actions"><button class="atlan-btn atlan-btn--primary" type="submit">Guardar habitación <span aria-hidden="true">→</span></button><a class="atlan-btn atlan-btn--secondary" th:href="@{/admin/habitaciones/read}">Cancelar</a></div>
      </form>
    </div></main>
    <div th:replace="~{fragments/admin-shell :: footer}"></div>
    <script>const contenedorFotos=document.getElementById("fotos-adicionales");const botonAgregarFoto=document.getElementById("agregar-foto");let indiceFoto=contenedorFotos.querySelectorAll("input").length;botonAgregarFoto.addEventListener("click",()=>{const fila=document.createElement("div");fila.className="photo-field";const numero=document.createElement("span");numero.className="photo-field__number";numero.textContent=indiceFoto+1;const envoltura=document.createElement("div");const etiqueta=document.createElement("label");etiqueta.className="visually-hidden";etiqueta.htmlFor=`foto-${indiceFoto}`;etiqueta.textContent="URL de foto adicional";const campo=document.createElement("input");campo.className="portal-control form-control";campo.type="url";campo.id=`foto-${indiceFoto}`;campo.name=`fotos[${indiceFoto}]`;campo.placeholder="https://ejemplo.com/habitacion-adicional.jpg";envoltura.append(etiqueta,campo);fila.append(numero,envoltura);contenedorFotos.appendChild(fila);indiceFoto+=1;});</script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
