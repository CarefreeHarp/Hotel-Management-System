<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${titulo + ' | Atlan Suites'}">Room form | Atlan Suites</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script><script>tailwind.config = { prefix: "tw-", corePlugins: { preflight: false } };</script>
    <link rel="stylesheet" th:href="@{/css/habitaciones/formulario.css}" href="/css/habitaciones/formulario.css" />
  </head>
  <body class="portal-body">
    <div th:replace="~{fragments/admin-shell :: header('habitaciones')}"></div>
    <main class="portal-main"><div class="container-xxl">
      <header class="page-heading"><div><p class="page-eyebrow">Hotel inventory</p><h1 class="page-title" th:text="${titulo}">Room</h1><p class="page-description">Define the room's location, category, status, and images.</p></div></header>
      <form class="surface-card form-card" th:action="${accion}" th:object="${habitacion}" method="post">
        <div class="portal-alert" th:if="${error}" role="alert" th:text="${error}"></div>
        <section class="form-section" aria-labelledby="room-basic-title"><h2 class="form-section__title" id="room-basic-title">Room information</h2><p class="form-section__description">Details used to locate the room and link it to the catalog.</p>
          <div class="row g-3"><div class="col-md-6"><label class="portal-label form-label" for="numero">Number</label><input class="portal-control form-control" id="numero" type="number" min="1" th:field="*{numero}" placeholder="e.g. 301" required /></div><div class="col-md-6"><label class="portal-label form-label" for="piso">Floor</label><input class="portal-control form-control" id="piso" type="number" min="0" th:field="*{piso}" placeholder="e.g. 3" required /></div><div class="col-md-6"><label class="portal-label form-label" for="idTipo">Room type</label><select class="portal-select form-select" id="idTipo" th:field="*{idTipo}" required><option value="0">Select a type</option><option th:each="tipo : ${tipos}" th:value="${tipo.idTipo}" th:text="${tipo.nombre}">Suite</option></select></div><div class="col-md-6"><label class="portal-label form-label" for="estado">Operating status</label><select class="portal-select form-select" id="estado" th:field="*{estado}" required><option value="">Select a status</option><option th:each="estado : ${estados}" th:if="${estado.name() != 'MANTENIMIENTO'}" th:value="${estado}" th:text="${estado.name() == 'DISPONIBLE' ? 'Available' : 'Occupied'}">Available</option></select></div><div class="col-12"><div class="availability-box"><label class="portal-label" for="disponible">Available for booking</label><div class="form-check form-switch mb-0"><input class="form-check-input" id="disponible" type="checkbox" role="switch" th:field="*{disponible}" /></div></div></div></div>
        </section>
        <section class="form-section" aria-labelledby="room-photos-title"><h2 class="form-section__title" id="room-photos-title">Gallery</h2><p class="form-section__description">Add public links to high-quality landscape photos.</p>
          <div class="mb-3"><label class="portal-label form-label" for="fotoPrincipal">Main photo URL</label><input class="portal-control form-control" id="fotoPrincipal" type="url" th:field="*{fotoPrincipal}" placeholder="https://example.com/room.jpg" /></div>
          <div class="photo-fields" id="additional-photos"><div class="photo-field" th:each="foto, estadoFoto : *{fotos}"><span class="photo-field__number" th:text="${estadoFoto.index + 1}">1</span><div><label class="visually-hidden" th:for="'foto-' + ${estadoFoto.index}">Additional photo URL</label><input class="portal-control form-control" type="url" th:id="'foto-' + ${estadoFoto.index}" th:field="*{fotos[__${estadoFoto.index}__]}" placeholder="https://example.com/additional-room-photo.jpg" /></div></div></div>
          <button class="atlan-btn atlan-btn--secondary atlan-btn--small mt-3" id="add-photo" type="button">＋ Add another photo</button>
        </section>
        <div class="form-actions"><button class="atlan-btn atlan-btn--primary" type="submit">Save room <span aria-hidden="true">→</span></button><a class="atlan-btn atlan-btn--secondary" th:href="@{/admin/habitaciones/read}">Cancel</a></div>
      </form>
    </div></main>
    <div th:replace="~{fragments/admin-shell :: footer}"></div>
    <script>const additionalPhotos=document.getElementById("additional-photos");const addPhotoButton=document.getElementById("add-photo");let photoIndex=additionalPhotos.querySelectorAll("input").length;addPhotoButton.addEventListener("click",()=>{const row=document.createElement("div");row.className="photo-field";const number=document.createElement("span");number.className="photo-field__number";number.textContent=photoIndex+1;const wrapper=document.createElement("div");const label=document.createElement("label");label.className="visually-hidden";label.htmlFor=`photo-${photoIndex}`;label.textContent="Additional photo URL";const input=document.createElement("input");input.className="portal-control form-control";input.type="url";input.id=`photo-${photoIndex}`;input.name=`fotos[${photoIndex}]`;input.placeholder="https://example.com/additional-room-photo.jpg";wrapper.append(label,input);row.append(number,wrapper);additionalPhotos.appendChild(row);photoIndex+=1;});</script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
