<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Room details | Atlan Suites</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script><script>tailwind.config = { prefix: "tw-", corePlugins: { preflight: false } };</script>
    <link rel="stylesheet" th:href="@{/css/habitaciones/detalle.css}" href="/css/habitaciones/detalle.css" />
  </head>
  <body class="portal-body">
    <div th:replace="~{fragments/admin-shell :: header('habitaciones')}"></div>
    <main class="portal-main"><div class="container-xxl">
      <header class="page-heading"><div><p class="page-eyebrow">Inventory record</p><h1 class="page-title">Room <span th:text="${habitacion.numero}">101</span></h1><p class="page-description">Current status, category, and visual assets for the room.</p></div><a class="atlan-btn atlan-btn--primary" th:href="@{/admin/habitaciones/update/{numero}(numero=${habitacion.numero})}">Edit room</a></header>
      <section class="detail-grid">
        <figure class="detail-visual mb-0" th:if="${habitacion.fotoPrincipal != null and !habitacion.fotoPrincipal.isBlank()}"><img th:src="${habitacion.fotoPrincipal}" alt="Main room photo" /></figure><div class="detail-visual detail-placeholder" th:unless="${habitacion.fotoPrincipal != null and !habitacion.fotoPrincipal.isBlank()}" aria-label="Room without a photo"><span th:text="${habitacion.numero}">101</span></div>
        <article class="surface-card detail-content"><p class="page-eyebrow">General information</p><dl class="detail-list"><div><dt>Number</dt><dd th:text="${habitacion.numero}">101</dd></div><div><dt>Floor</dt><dd th:text="${habitacion.piso}">1</dd></div><div><dt>Status</dt><dd th:text="${habitacion.estado}">AVAILABLE</dd></div><div><dt>Availability</dt><dd th:text="${habitacion.disponible ? 'Available' : 'Unavailable'}">Available</dd></div><div><dt>Room type</dt><dd th:text="${tipo != null ? tipo.nombre : 'Room type not found'}">Suite</dd></div></dl><div class="form-actions"><a class="atlan-btn atlan-btn--secondary" th:href="@{/admin/habitaciones/read}">← Back to list</a></div></article>
      </section>
      <section class="surface-card gallery-section" th:if="${!#lists.isEmpty(habitacion.fotos)}" aria-labelledby="additional-photos-title"><p class="page-eyebrow">Gallery</p><h2 class="form-section__title" id="additional-photos-title">Additional photos</h2><ul class="gallery-grid"><li th:each="foto : ${habitacion.fotos}"><img th:src="${foto}" alt="Additional room photo" loading="lazy" /></li></ul></section>
    </div></main>
    <div th:replace="~{fragments/admin-shell :: footer}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
