<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title th:text="${titulo}">Formulario de tipo de habitación</title>
  </head>
  <body>
    <!--
      PANTALLA DE PRUEBA: sin diseño, solo para verificar el CRUD por capas.
      El mismo formulario sirve para crear y para editar; lo único que cambia es
      el título y la URL a la que se envía, que los manda el controlador.
    -->
    <h1 th:text="${titulo}">Formulario de tipo de habitación</h1>

    <!-- ERROR DEVUELTO POR LA CAPA DE SERVICIO (nombre repetido, datos inválidos) -->
    <p th:if="${error}" th:text="${error}" style="color: red"></p>

    <form th:action="${accion}" th:object="${tipo}" method="post">
      <p>
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" th:field="*{nombre}" required maxlength="40" />
      </p>
      <p>
        <label for="descripcion">Descripción</label>
        <textarea id="descripcion" th:field="*{descripcion}" required maxlength="300" rows="3"></textarea>
      </p>
      <p>
        <label for="precioNoche">Precio por noche</label>
        <input type="number" id="precioNoche" th:field="*{precioNoche}" required min="0" step="1000" />
      </p>
      <p>
        <label for="capacidadMaxima">Capacidad máxima</label>
        <input type="number" id="capacidadMaxima" th:field="*{capacidadMaxima}" required min="1" max="10" />
      </p>

      <button type="submit">Guardar</button>
    </form>

    <p><a th:href="@{/admin/tipos-habitacion/read}">Volver al listado</a></p>
  </body>
</html>
