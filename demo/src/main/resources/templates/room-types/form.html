<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${titulo + ' | Atlan Suites'}">Room type form | Atlan Suites</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script><script>tailwind.config = { prefix: "tw-", corePlugins: { preflight: false } };</script>
    <link rel="stylesheet" th:href="@{/css/room-types/form.css}" href="/css/room-types/form.css" />
  </head>
  <body class="portal-body tw-text-[15px] sm:tw-text-base md:tw-text-[1.02rem] lg:tw-text-[1.04rem] xl:tw-text-[1.06rem] 2xl:tw-text-[1.08rem]">
    <th:block th:replace="~{fragments/admin-shell :: header('tipos')}"></th:block>
    <main class="portal-main"><div class="tw-mx-auto tw-w-full tw-max-w-7xl tw-px-4 sm:tw-px-6 lg:tw-px-8 xl:tw-max-w-[1280px] 2xl:tw-max-w-[1440px]">
      <header class="page-heading"><div><p class="page-eyebrow">Accommodation catalog</p><h1 class="page-title" th:text="${titulo}">New room type</h1><p class="page-description">Define how this category will appear in the hotel inventory.</p></div></header>
      <form class="surface-card form-card type-form-card" th:action="${accion}" th:object="${tipo}" method="post">
        <aside class="portal-alert" th:if="${error}" role="alert" th:text="${error}"></aside>
        <section class="form-section" aria-labelledby="type-data-title"><h2 class="form-section__title" id="type-data-title">Commercial information</h2><p class="form-section__description">Display name, description, base rate, and permitted occupancy.</p>
          <div class="tw-grid tw-grid-cols-1 tw-gap-4 sm:tw-grid-cols-2 lg:tw-gap-6"><div class="tw-min-w-0"><label class="portal-label" for="name">Name</label><input class="portal-control tw-w-full tw-px-4 tw-py-3" type="text" id="name" th:field="*{name}" placeholder="e.g. Ocean View Suite" required maxlength="40" /></div><div class="tw-min-w-0"><label class="portal-label" for="maxCapacity">Maximum capacity</label><input class="portal-control tw-w-full tw-px-4 tw-py-3" type="number" id="maxCapacity" th:field="*{maxCapacity}" placeholder="2" required min="1" max="10" /></div><div class="tw-col-span-full"><label class="portal-label" for="description">Description</label><textarea class="portal-control tw-w-full tw-px-4 tw-py-3" id="description" th:field="*{description}" placeholder="Describe the spaces, amenities, and key features..." required maxlength="300" rows="4"></textarea><p class="field-hint">Maximum 300 characters.</p></div><div class="tw-min-w-0"><label class="portal-label" for="nightlyPrice">Price per night</label><div class="currency-field"><input class="portal-control tw-w-full tw-px-4 tw-py-3" type="number" id="nightlyPrice" th:field="*{nightlyPrice}" placeholder="350000" required min="0" step="1000" /></div></div></div>
        </section>
        <section class="form-section" aria-labelledby="type-photos-title"><h2 class="form-section__title" id="type-photos-title">Gallery</h2><p class="form-section__description">These photos represent every room assigned to this type.</p>
          <div class="tw-mb-3"><label class="portal-label" for="mainPhoto">Main photo URL</label><input class="portal-control tw-w-full tw-px-4 tw-py-3" id="mainPhoto" type="url" th:field="*{mainPhoto}" placeholder="https://example.com/room-type.jpg" required /></div>
          <div class="photo-fields" id="additional-photos"><div class="photo-field" th:each="photo, photoState : *{secondaryPhotos}"><span class="photo-field__number" th:text="${photoState.index + 1}">1</span><div><label class="tw-sr-only" th:for="'photo-' + ${photoState.index}">Additional photo URL</label><input class="portal-control tw-w-full tw-px-4 tw-py-3" type="url" th:id="'photo-' + ${photoState.index}" th:field="*{secondaryPhotos[__${photoState.index}__]}" placeholder="https://example.com/additional-room-type-photo.jpg" /></div></div></div>
          <button class="atlan-btn atlan-btn--secondary atlan-btn--small tw-mt-3" id="add-photo" type="button">＋ Add another photo</button>
        </section>
        <div class="form-actions tw-flex tw-gap-3"><button class="atlan-btn atlan-btn--primary" type="submit">Save room type <span aria-hidden="true">→</span></button><a class="atlan-btn atlan-btn--secondary" th:href="@{/admin/room-types/read}">Cancel</a></div>
      </form>
    </div></main>
    <th:block th:replace="~{fragments/admin-shell :: footer}"></th:block><script th:src="@{/js/room-types/form.js}" src="/js/room-types/form.js"></script>
  </body>
</html>
