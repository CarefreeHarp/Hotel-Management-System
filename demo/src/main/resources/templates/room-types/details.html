<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${tipo.name + ' | Atlan Suites'}">Room type details | Atlan Suites</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script><script>tailwind.config = { prefix: "tw-", corePlugins: { preflight: false } };</script>
    <link rel="stylesheet" th:href="@{/css/room-types/details.css}" href="/css/room-types/details.css" />
  </head>
  <body class="portal-body tw-text-[15px] sm:tw-text-base md:tw-text-[1.02rem] lg:tw-text-[1.04rem] xl:tw-text-[1.06rem] 2xl:tw-text-[1.08rem]">
    <th:block th:replace="~{fragments/admin-shell :: header('tipos')}"></th:block>
    <main class="portal-main"><div class="tw-mx-auto tw-w-full tw-max-w-7xl tw-px-4 sm:tw-px-6 lg:tw-px-8 xl:tw-max-w-[1280px] 2xl:tw-max-w-[1440px]">
      <header class="page-heading"><div><p class="page-eyebrow">Accommodation catalog</p><h1 class="page-title" th:text="${tipo.name}">Room type</h1><p class="page-description">Shared gallery and commercial information for rooms in this category.</p></div><a class="atlan-btn atlan-btn--primary" th:href="@{/admin/room-types/update/{name}(name=${tipo.name})}">Edit room type</a></header>
      <section class="detail-grid">
        <figure class="detail-visual mb-0"><img th:src="${tipo.mainPhoto}" th:alt="|Main photo for ${tipo.name}|" /></figure>
        <article class="surface-card detail-content"><p class="page-eyebrow">Commercial information</p><dl class="detail-list"><div><dt>Description</dt><dd th:text="${tipo.description}">Description</dd></div><div><dt>Price per night</dt><dd th:text="|COP ${#numbers.formatDecimal(tipo.nightlyPrice, 0, 'POINT', 0, 'COMMA')}|">COP 250.000</dd></div><div><dt>Maximum capacity</dt><dd th:text="|${tipo.maxCapacity} guests|">2 guests</dd></div></dl><div class="form-actions"><a class="atlan-btn atlan-btn--secondary" th:href="@{/admin/room-types/read}">← Back to list</a></div></article>
      </section>
      <section class="surface-card gallery-section" th:if="${!#lists.isEmpty(tipo.secondaryPhotos)}" aria-labelledby="additional-photos-title"><p class="page-eyebrow">Gallery</p><h2 class="form-section__title" id="additional-photos-title">Additional photos</h2><ul class="gallery-grid"><li th:each="photo : ${tipo.secondaryPhotos}"><img th:src="${photo}" th:alt="|Additional photo for ${tipo.name}|" loading="lazy" /></li></ul></section>
    </div></main>
    <th:block th:replace="~{fragments/admin-shell :: footer}"></th:block>
  </body>
</html>
