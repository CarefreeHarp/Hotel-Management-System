<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${'Cliente: ' + cliente.nombre + ' | Atlan Suites'}">Detalle del cliente | Atlan Suites</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script><script>tailwind.config = { prefix: "tw-", corePlugins: { preflight: false } };</script>
    <link rel="stylesheet" th:href="@{/css/clientes/detalle.css}" href="/css/clientes/detalle.css" />
  </head>
  <body class="portal-body">
    <div th:replace="~{fragments/admin-shell :: header('clientes')}"></div>
    <main class="portal-main"><div class="container-xxl">
      <header class="page-heading"><div><p class="page-eyebrow">Perfil del huésped</p><h1 class="page-title" th:text="|${cliente.nombre} ${cliente.apellido}|">Nombre del cliente</h1><p class="page-description">Información personal y datos de contacto registrados en el portal.</p></div><a class="atlan-btn atlan-btn--primary" th:href="@{/clientes/update/{correo}(correo=${cliente.correo})}">Editar perfil</a></header>
      <section class="detail-grid">
        <figure class="detail-visual profile-visual mb-0" th:if="${cliente.fotoPerfil != null and !cliente.fotoPerfil.isBlank()}"><img th:src="${cliente.fotoPerfil}" alt="Foto de perfil del cliente" /></figure>
        <div class="detail-visual profile-visual detail-placeholder" th:unless="${cliente.fotoPerfil != null and !cliente.fotoPerfil.isBlank()}" aria-label="Perfil sin fotografía"><span th:text="${#strings.substring(cliente.nombre, 0, 1)}">A</span></div>
        <article class="surface-card detail-content">
          <p class="page-eyebrow">Datos registrados</p>
          <dl class="detail-list"><div><dt>Nombre</dt><dd th:text="${cliente.nombre}">Nombre</dd></div><div><dt>Apellido</dt><dd th:text="${cliente.apellido}">Apellido</dd></div><div><dt>Cédula</dt><dd th:text="${cliente.cedula}">000000</dd></div><div><dt>Teléfono</dt><dd th:text="${cliente.telefono}">3000000000</dd></div><div><dt>Correo electrónico</dt><dd th:text="${cliente.correo}">correo@ejemplo.com</dd></div></dl>
          <div class="form-actions"><a class="atlan-btn atlan-btn--secondary" th:href="@{/clientes/read}">← Volver al listado</a></div>
        </article>
      </section>
    </div></main>
    <div th:replace="~{fragments/admin-shell :: footer}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
