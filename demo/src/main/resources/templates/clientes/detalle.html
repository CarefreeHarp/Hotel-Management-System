<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${'Client: ' + cliente.nombre + ' | Atlan Suites'}">Client details | Atlan Suites</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script><script>tailwind.config = { prefix: "tw-", corePlugins: { preflight: false } };</script>
    <link rel="stylesheet" th:href="@{/css/clientes/detalle.css}" href="/css/clientes/detalle.css" />
  </head>
  <body class="portal-body">
    <div th:replace="~{fragments/admin-shell :: header('clientes')}"></div>
    <main class="portal-main"><div class="container-xxl">
      <header class="page-heading"><div><p class="page-eyebrow">Guest profile</p><h1 class="page-title" th:text="|${cliente.nombre} ${cliente.apellido}|">Client name</h1><p class="page-description">Personal information and contact details registered in the portal.</p></div><div class="tw-flex tw-flex-wrap tw-gap-2"><a class="atlan-btn atlan-btn--primary" th:href="@{/clientes/update/{correo}(correo=${cliente.correo})}">Edit profile</a><form th:action="@{/clientes/delete/{correo}(correo=${cliente.correo})}" method="post" onsubmit="return confirm('Do you want to delete this account?');"><button class="atlan-btn atlan-btn--danger" type="submit">Delete account</button></form></div></header>
      <section class="detail-grid">
        <figure class="detail-visual profile-visual mb-0" th:if="${cliente.fotoPerfil != null and !cliente.fotoPerfil.isBlank()}"><img th:src="${cliente.fotoPerfil}" alt="Client profile photo" /></figure>
        <div class="detail-visual profile-visual detail-placeholder" th:unless="${cliente.fotoPerfil != null and !cliente.fotoPerfil.isBlank()}" aria-label="Profile without a photo"><span th:text="${#strings.substring(cliente.nombre, 0, 1)}">A</span></div>
        <article class="surface-card detail-content">
          <p class="page-eyebrow">Registered details</p>
          <dl class="detail-list"><div><dt>First name</dt><dd th:text="${cliente.nombre}">First name</dd></div><div><dt>Last name</dt><dd th:text="${cliente.apellido}">Last name</dd></div><div><dt>National ID</dt><dd th:text="${cliente.cedula}">000000</dd></div><div><dt>Phone</dt><dd th:text="${cliente.telefono}">3000000000</dd></div><div><dt>Email</dt><dd th:text="${cliente.correo}">email@example.com</dd></div></dl>
        </article>
      </section>
    </div></main>
    <div th:replace="~{fragments/admin-shell :: footer}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
