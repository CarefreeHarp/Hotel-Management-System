<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <body>
    <header class="portal-header portal-header--admin" th:fragment="header(activePage)">
      <nav aria-label="Administrative navigation">
        <div class="portal-header__inner tw-mx-auto tw-flex tw-w-full tw-max-w-7xl tw-flex-wrap tw-items-center tw-px-4 sm:tw-px-6 lg:tw-flex-nowrap lg:tw-px-8 xl:tw-max-w-[1280px] 2xl:tw-max-w-[1440px]">
          <a class="portal-brand" th:href="@{/}" aria-label="Back to the Atlan Suites home page">
            <img
              th:src="@{/images/images-utils/hotel-identity/logo-transparent.png}"
              src="/images/images-utils/hotel-identity/logo-transparent.png"
              alt="Atlan Suites"
            />
          </a>

          <button
            class="portal-menu-button tw-ml-auto lg:tw-hidden"
            type="button"
            aria-controls="portalNavigation"
            aria-expanded="false"
            aria-label="Open menu"
            data-admin-menu-toggle
          >
            <span></span><span></span><span></span>
          </button>

          <div class="tw-hidden tw-w-full tw-flex-col tw-gap-3 tw-pb-4 lg:tw-flex lg:tw-w-auto lg:tw-flex-1 lg:tw-flex-row lg:tw-flex-wrap lg:tw-items-center lg:tw-justify-between lg:tw-py-3" id="portalNavigation" data-admin-menu>
            <div class="portal-nav tw-flex-col sm:tw-flex-row sm:tw-flex-wrap lg:tw-w-full lg:tw-justify-center">
              <a
                class="portal-nav__link"
                th:classappend="${activePage == 'panel'} ? ' is-active' : ''"
                th:href="@{/admin/panel}"
               th:text="${session.isAdmin == true ? 'Admin panel' : 'Operator panel'}">Panel</a>
              <a
                class="portal-nav__link"
                th:classappend="${activePage == 'clientes'} ? ' is-active' : ''"
                th:href="@{/admin/clients/read}"
              >Clients</a>
              <a
                class="portal-nav__link"
                th:classappend="${activePage == 'tipos'} ? ' is-active' : ''"
                th:href="@{/admin/room-types/read}"
              >Room types</a>
              <a
                class="portal-nav__link"
                th:classappend="${activePage == 'habitaciones'} ? ' is-active' : ''"
                th:href="@{/admin/rooms/read}"
              >Rooms</a>
              <a
                class="portal-nav__link"
                th:classappend="${activePage == 'administradores'} ? ' is-active' : ''"
                th:if="${session.isAdmin == true}" th:href="@{/admin/administrators/read}"
              >Administrators</a>
              <a
                class="portal-nav__link"
                th:classappend="${activePage == 'operarios'} ? ' is-active' : ''"
                th:if="${session.isAdmin == true}" th:href="@{/admin/operators/read}"
              >Operators</a>
            </div>

            <a class="portal-nav__link" th:if="${session.profileUrl != null}" th:href="${session.profileUrl}">My profile</a>
            <form th:action="@{/logout}" method="post"><button class="atlan-btn atlan-btn--secondary atlan-btn--small" type="submit">Sign out</button></form>
            <a class="portal-exit" th:href="@{/}">
              Go to hotel <span aria-hidden="true">↗</span>
            </a>
          </div>
        </div>
      </nav>
    </header>

    <footer class="portal-footer" th:fragment="footer">
      <div class="portal-footer__inner tw-mx-auto tw-w-full tw-max-w-7xl tw-px-4 sm:tw-px-6 lg:tw-px-8 xl:tw-max-w-[1280px] 2xl:tw-max-w-[1440px]">
        <p>Atlan Suites <span aria-hidden="true">·</span> Staff portal</p>
        <a th:href="@{/}">Back to the hotel website</a>
      </div>
      <script>
        (() => {
          const toggle = document.querySelector('[data-admin-menu-toggle]');
          const menu = document.querySelector('[data-admin-menu]');
          if (!toggle || !menu) return;
          toggle.addEventListener('click', () => {
            const isOpen = !menu.classList.contains('tw-hidden');
            menu.classList.toggle('tw-hidden', isOpen);
            toggle.setAttribute('aria-expanded', String(!isOpen));
          });
        })();
      </script>
    </footer>
  </body>
</html>
