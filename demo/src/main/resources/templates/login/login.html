<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head><meta charset="UTF-8" /><title>Login</title></head>
  <body>
    <main>
      <h1>Login</h1>
      <p th:if="${error}" th:text="${error}"></p>
      <form th:action="@{/login}" method="post">
        <p><label for="usuario">Usuario</label><input id="usuario" name="usuario" type="text" required /></p>
        <p><label for="password">Contraseña</label><input id="password" name="password" type="password" required /></p>
        <button type="submit">Entrar</button>
      </form>
      <p><a th:href="@{/clientes/create}">Crear cliente</a></p>
    </main>
  </body>
</html>
