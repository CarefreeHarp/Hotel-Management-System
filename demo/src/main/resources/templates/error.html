<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notice | Atlan Suites</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { prefix: "tw-", corePlugins: { preflight: false } };
    </script>
    <link rel="stylesheet" th:href="@{/css/css-utils/base/common.css}" href="/css/css-utils/base/common.css" />
    <link rel="stylesheet" th:href="@{/css/error/error.css}" href="/css/error/error.css" />
  </head>
  <body class="error-body tw-text-[15px] sm:tw-text-base md:tw-text-[1.02rem]">
    <main class="error-container">
      <article class="error-card">
        <a th:href="@{/}" class="error-logo" aria-label="Atlan Suites Home">
          <img
            th:src="@{/images/images-utils/hotel-identity/logo-transparent.png}"
            src="/images/images-utils/hotel-identity/logo-transparent.png"
            alt="Atlan Suites"
          />
        </a>

        <!-- Reemplaza al numero de estado como foco visual de la tarjeta. -->
        <span class="error-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <circle cx="12" cy="12" r="9" />
            <path d="M12 7.5v5.25" />
            <path d="M12 16.4h.01" />
          </svg>
        </span>

        <p class="error-badge error-badge--warning">
            <span aria-hidden="true">●</span>
            <span>Notice</span>
        </p>

        <!-- Solo el aviso: ni codigo de estado ni detalles tecnicos. El mensaje
             es el titular, porque es la unica informacion util de la pantalla. -->
        <h2 class="error-message"
            th:text="${error != null and error != ''} ? ${error} : 'We could not complete the action you requested.'">
          We could not complete the action you requested.
        </h2>

        <p class="error-desc">
          You can go back to the previous page or return to the homepage.
        </p>

        <nav class="error-actions" aria-label="Error page actions">
          <a th:if="${param.operatorId != null and param.adminId == null}" th:href="@{/operators/panel/{id}(id=${param.operatorId[0]})}" class="btn-error-primary">Back to operator panel</a>
          <a th:if="${param.adminId != null}" th:href="@{/admin/panel/{id}(id=${param.adminId[0]})}" class="btn-error-primary">Back to admin panel</a>
          <a th:href="@{/}" th:unless="${param.adminId != null or param.operatorId != null}" class="btn-error-primary">
            <span>Return to Home</span>
            <span aria-hidden="true">↗</span>
          </a>
          <button type="button" onclick="history.back()" class="btn-error-secondary">
            <span aria-hidden="true">←</span>
            <span>Go Back</span>
          </button>
          <a th:href="@{/}" th:if="${param.adminId != null or param.operatorId != null}" class="btn-error-secondary">
            <span>Home</span>
          </a>
        </nav>

        <p class="error-signin">
          <a th:href="@{/login}">Sign in to your account</a>
        </p>
      </article>
    </main>

    <footer class="error-footer">
      <p>© 2026 Atlan Suites. All rights reserved.</p>
    </footer>
  </body>
</html>
