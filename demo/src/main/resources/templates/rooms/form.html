<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${titulo + ' | Atlan Suites'}">Room form | Atlan Suites</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script><script>tailwind.config = { prefix: "tw-", corePlugins: { preflight: false } };</script>
    <link rel="stylesheet" th:href="@{/css/rooms/form.css}" href="/css/rooms/form.css" />
  </head>
  <body class="portal-body tw-text-[15px] sm:tw-text-base md:tw-text-[1.02rem] lg:tw-text-[1.04rem] xl:tw-text-[1.06rem] 2xl:tw-text-[1.08rem]">
    <th:block th:replace="~{fragments/admin-shell :: header('habitaciones')}"></th:block>
    <main class="portal-main"><div class="tw-mx-auto tw-w-full tw-max-w-7xl tw-px-4 sm:tw-px-6 lg:tw-px-8 xl:tw-max-w-[1280px] 2xl:tw-max-w-[1440px]">
      <header class="page-heading"><div><p class="page-eyebrow">Hotel inventory</p><h1 class="page-title" th:text="${titulo}">Room</h1><p class="page-description">Define the room's location, category, and operating status.</p></div></header>
      <form class="surface-card form-card" th:action="${accion}" th:object="${habitacion}" method="post" novalidate>
        <aside class="portal-alert" th:if="${error}" role="alert" th:text="${error}"></aside>
        <section class="form-section" aria-labelledby="room-basic-title"><h2 class="form-section__title" id="room-basic-title">Room information</h2><p class="form-section__description">Details used to locate the room and link it to the catalog.</p>
          <div class="tw-grid tw-grid-cols-1 tw-gap-4 sm:tw-grid-cols-2 lg:tw-gap-6"><div class="tw-min-w-0"><label class="portal-label" for="number">Number</label><input class="portal-control tw-w-full tw-px-4 tw-py-3" id="number" type="number" th:field="*{number}" placeholder="e.g. 301" /></div><div class="tw-min-w-0"><label class="portal-label" for="floor">Floor</label><input class="portal-control tw-w-full tw-px-4 tw-py-3" id="floor" type="number" th:field="*{floor}" placeholder="e.g. 3" /></div><div class="tw-min-w-0"><label class="portal-label" for="roomTypeId">Room type</label><select class="portal-select tw-w-full tw-px-4 tw-py-3" id="roomTypeId" name="roomTypeId"><option value="">Select a type</option><option th:each="tipo : ${tipos}" th:value="${tipo.roomTypeId}" th:text="${tipo.name}" th:selected="${habitacion.roomType != null and habitacion.roomType.roomTypeId == tipo.roomTypeId}">Suite</option></select></div><div class="tw-min-w-0"><label class="portal-label" for="status">Operating status</label><select class="portal-select tw-w-full tw-px-4 tw-py-3" id="status" th:field="*{status}"><option value="">Select a status</option><option th:each="estado : ${estados}" th:value="${estado}" th:text="${estado.name() == 'AVAILABLE' ? 'Available' : (estado.name() == 'OCCUPIED' ? 'Occupied' : 'Maintenance')}">Available</option></select></div></div>
        </section>
        <div class="form-actions"><button class="atlan-btn atlan-btn--primary" type="submit">Save room <span aria-hidden="true">→</span></button><a class="atlan-btn atlan-btn--secondary" th:href="@{/admin/rooms/read}">Cancel</a></div>
      </form>
    </div></main>
    <th:block th:replace="~{fragments/admin-shell :: footer}"></th:block>
  </body>
</html>
