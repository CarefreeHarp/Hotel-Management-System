spring.application.name=demo
server.port=8080
#datasource
spring.jpa.database=h2
spring.datasource.driver-class-name=org.h2.Driver
#nombre base de datos
spring.datasource.url=jdbc:h2:file:./mydatabase
spring.datasource.username=sa
spring.datasource.password=
#consola de administracion de h2
spring.h2.console.enabled=true
#localhost:8080/h2
spring.h2.console.path=/h2
#Datos de prueba
spring.jpa.generate-ddl=true
#borrar la tabla cada vez
spring.jpa.hibernate.ddl-auto=create-drop
#spring.sql.init.mode=
# Logging
#permite imprimir la query
logging.level.org.hibernate.SQL=DEBUG
#imprime los parametros de las querys
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE 
spring.jpa.properties.hibernate.format_sql=true

# Reloj usado por las reglas del negocio. Para pruebas: mode=fixed e instante ISO-8601 en UTC.
app.clock.mode=system
app.clock.zone=America/Bogota
#app.clock.fixed-instant=2026-09-18T00:00:00-05:00
